security.body=<html><p>此操作将通过 Arthas 在<strong>运行中的 JVM</strong>内执行任意 Java 方法。</p><p>请确认：</p><ul><li>仅用于<strong>开发/调试环境</strong></li><li>不要在生产环境使用</li><li>调用可能产生副作用（写数据库、发消息等）</li></ul></html>

