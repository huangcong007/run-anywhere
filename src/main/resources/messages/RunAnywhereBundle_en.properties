# Run Anywhere message bundle (English translation)
# Base bundle (messages.RunAnywhereBundle.properties) is Chinese; this file is used
# when the IDE runs with an English locale.

# ── Action ────────────────────────────────────────────
action.runMethod.text=Run Method (Run Anywhere)
action.runMethod.description=Invoke this method inside the running JVM through the bundled Arthas

# ── Tool window ───────────────────────────────────────
toolWindow.title=Run Anywhere
toolWindow.welcomeTab=Welcome

