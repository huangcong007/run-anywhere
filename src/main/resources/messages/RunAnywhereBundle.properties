# Run Anywhere 文案 Bundle（主语言：中文）

# ── 入口动作 ─────────────────────────────────────────
action.runMethod.text=运行方法 (Run Anywhere)
action.runMethod.description=通过内置 Arthas 调用运行中 JVM 内的该方法

# ── 工具窗口 ─────────────────────────────────────────
toolWindow.title=Run Anywhere
toolWindow.welcomeTab=欢迎使用

# ── 进程选择 ─────────────────────────────────────────
process.select.title=选择目标进程（未能自动匹配）
process.empty.title=没有可调用的进程
process.empty.body=未检测到运行中的 Java 进程。请先运行你的应用程序，然后再调用方法。
process.info.title=已选择进程
process.info.body=自动选择 PID {0}（{1}）。

# ── 安全确认 ─────────────────────────────────────────
security.dialog.title=Run Anywhere - 安全确认
security.ok=我了解，继续调用
security.cancel=取消
security.dontAsk=不再提示

# ── 参数输入 ─────────────────────────────────────────
param.dialog.title=输入方法参数
param.ok=调用
param.cancel=取消
param.col.name=参数名
param.col.type=类型
param.col.value=值
param.col.null=传 null
param.null.accessibleName=是否将参数 {0} 设为 null
param.empty=该方法无参数。
param.unsupported.type=不支持的类型，将传 null
param.json.hint=通过 JSON 输入；反序列化库可在 Settings → Other Settings → Run Anywhere 配置

# ── 实例选择 ─────────────────────────────────────────
instance.pick.title=选择实例
instance.pick.ok=调用
instance.pick.cancel=取消
instance.pick.label=类 {0} 有 {1} 个实例，请选择要调用的那个。
instance.pick.cancelled=已取消选择实例。
instance.pick.none=类 {0} 在目标 JVM 中没有已创建的实例。

# ── 设置页 ───────────────────────────────────────────
settings.name=Run Anywhere
settings.async=异步执行（后台等待返回值，断点不超时）
settings.async.tip=使用 Arthas async_exec 提交命令，再拉取返回值。\n目标线程停在断点时不会触发插件 HTTP 超时。等待上限与执行超时相同。
settings.warmup=进程启动后预热 Attach
settings.warmup.tip=应用启动约 2 秒后自动 Attach。关闭时只在点击「运行方法」后注入 Arthas。\nHTTP 只监听 127.0.0.1，会话超时 30 分钟。
settings.timeout.label=执行超时（秒）
settings.timeout.hint=同步执行的 Arthas 超时，也是异步模式等待返回值的上限（{0}-{1} 秒）。
settings.expand.label=结果展开层级
settings.expand.hint=Arthas -x 展开层级（{0}-{1}）。返回 void 时固定为 0。
settings.jsonLib.label=对象参数 JSON 库
settings.jsonLib.hint=无 Jackson 时可选手动指定 Gson / Fastjson；自动模式会按 classpath 依次尝试。
settings.restoreSecurity=恢复首次安全提示
settings.restoreSecurity.tip=重新开启首次调用前的风险确认对话框
settings.error.timeout=执行超时必须介于 {0}-{1} 秒之间（当前 {2}）。
settings.error.expand=结果展开层级必须介于 {0}-{1} 之间（当前 {2}）。

# ── 执行反馈 ─────────────────────────────────────────
exec.attachFail.title=Attach 失败
exec.attachFail.reasons=1. 目标 JVM 不允许 attach\n2. Arthas 启动超时\n3. HTTP 端口被占用
exec.attachFail.body=Arthas attach 到 PID {0}（{1}）失败。\n可能原因：\n{2}\n\n请查看 idea.log 获取详细日志（搜索 [Arthas]）。
exec.attachFail.notify=无法连接 PID {0}（{1}），详情见 Run Anywhere 工具窗口。
exec.fail.title=方法调用失败
exec.fail.body=PID {0} {1}() 返回失败。\n请查看工具窗口了解详情。
exec.cancelled=已取消。

