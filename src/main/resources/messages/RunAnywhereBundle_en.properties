# ── Settings ──────────────────────────────────────────
settings.name=Run Anywhere
settings.async=Asynchronous execution (wait in background, breakpoints don't time out)
settings.async.tip=Submits the command with Arthas async_exec, then pulls the return value.\nA thread suspended at a breakpoint will not trigger the plugin HTTP timeout. The wait limit equals the execution timeout.
settings.warmup=Pre-attach after the process starts
settings.warmup.tip=Attaches automatically about 2 seconds after the application starts. When disabled, Arthas is injected only after you click "Run Method".\nHTTP listens on 127.0.0.1 only; sessions expire after 30 minutes.
settings.timeout.label=Execution timeout (seconds)
settings.timeout.hint=Arthas timeout for synchronous execution, also the wait limit for asynchronous results ({0}-{1} seconds).
settings.expand.label=Result expand depth
settings.expand.hint=Arthas -x expand depth ({0}-{1}). Fixed to 0 when the method returns void.
settings.jsonLib.label=JSON library for object arguments
settings.jsonLib.hint=If Jackson is unavailable, pick Gson / Fastjson manually; auto mode tries each library in classpath order.
settings.restoreSecurity=Restore first-run security prompt
settings.restoreSecurity.tip=Show the risk confirmation dialog again before the next invocation

# ── Execution feedback ────────────────────────────────
exec.attachFail.title=Attach failed
exec.attachFail.reasons=1. The target JVM does not allow attach\n2. Arthas startup timed out\n3. The HTTP port is already in use
exec.attachFail.body=Failed to attach Arthas to PID {0} ({1}).\nPossible reasons:\n{2}\n\nSee idea.log for details (search for [Arthas]).
exec.fail.title=Method invocation failed
exec.fail.body=PID {0} {1}() returned a failure.\nSee the tool window for details.
exec.cancelled=Cancelled.

