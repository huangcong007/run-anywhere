# ── Security confirmation body ────────────────────────
security.body=<html><p>This operation executes arbitrary Java methods inside the <strong>running JVM</strong> through Arthas.</p><p>Please confirm:</p><ul><li>Use it only in <strong>development/debug environments</strong></li><li>Do not use it in production</li><li>Invocations may cause side effects (writing to databases, sending messages, etc.)</li></ul></html>

