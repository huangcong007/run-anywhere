tab.command.header=【执行的命令】
tab.raw.header=【原始响应】
tab.error.prefix=错误：
tab.parsed.header=【解析结果】
tab.welcome=结果将显示在这里。\n右键点击任意 Java 方法 → Run Anywhere → 运行方法，即可向正在运行的 JVM 发起调用。
tab.welcome.title=还没有执行结果
tab.welcome.openSettings=打开设置
tab.welcome.help=查看使用说明
tab.copyButton=复制诊断信息
tab.toggleDetails=显示详情
tab.collapseDetails=收起详情

