hint.methodUnavailable=无法提取方法元数据。请确保该方法位于具有全限定名的类中。
notify.methodUnavailable.title=方法不可用

# ── 进度提示 ────────────────────────────────────────
progress.queryInstances=正在查询 {0} 的实例...
progress.title=运行 {0}()
progress.attach=连接目标进程（attach）...
progress.execute=执行 {0}()...
progress.waitResult=等待结果...
progress.done=完成

# ── 执行结果（内联） ────────────────────────────────
exec.asyncNoResult=已提交，但在 {0} 秒内没有等到返回值。若目标线程停在断点，继续执行后可重新调用。

# ── 结果解析文本 ────────────────────────────────────
parsed.noResult=(no result)
parsed.asyncSubmitted=已异步提交执行
parsed.jobId=Job ID：{0}
parsed.jobStatus=任务状态：{0}
parsed.session=Session：{0}
parsed.command=命令：{0}
parsed.note=说明：
parsed.asyncSubmitted.note1=命令已在目标 JVM 中调度。
parsed.asyncSubmitted.note2=若在等待上限内没有拿到返回值，多半是目标线程停在断点。继续执行后请重新调用。
parsed.failed=执行失败
parsed.reason=原因：{0}
parsed.sessionExpired.note1=说明：Arthas HTTP Session 已过期或被服务端清理。
parsed.sessionExpired.note2=插件会自动重建 Session 并重试；若仍失败，请重启目标应用后重试。
parsed.timeout=执行超时
parsed.timeout.limit=超时限制：{0}ms（{1} 秒）
parsed.timeout.defaultReason=执行超时，已被 Arthas 强制中断
parsed.suggestion=建议：
parsed.timeout.suggestion1=1. 勾选「异步执行」：命令在目标 JVM 后台运行，断点不会触发插件 HTTP 超时
parsed.timeout.suggestion2=2. 在 Settings → Other Settings → Run Anywhere 中增大「执行超时」
parsed.timeout.suggestion3=3. 确认目标方法不会在目标 JVM 中死锁或无限阻塞

