json.hint.map=JSON 对象，如 {"key1":{"id":1}}
json.error.object=参数 {0} 需要有效的 JSON 对象（以 { 开头）。
json.error.array=参数 {0} 需要有效的 JSON 数组（以 [ 开头）。
