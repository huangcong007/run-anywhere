tab.parsed.header=[Parsed Result]
tab.welcome=Results appear here.\nRight-click any Java method, then choose Run Anywhere | Run Method to invoke it in the running JVM.
tab.welcome.title=No results yet
tab.welcome.openSettings=Open Settings
tab.welcome.help=Read the docs
tab.copyButton=Copy diagnostics
tab.toggleDetails=Show details
tab.collapseDetails=Hide details
tab.copyButton.tip=Copy the command and the raw response to the clipboard
tab.toggleDetails.tip=Show or hide the raw command and response (for debugging)

# ── Screen reader ─────────────────────────────────────
announce.running=Method invocation started: {0}
announce.result=Run Anywhere: PID {0}, {1}.

# ── Method unavailable ────────────────────────────────
hint.methodUnavailable=Cannot extract method metadata. Make sure the method is declared in a class with a fully qualified name.
notify.methodUnavailable.title=Method Not Available

# ── Progress ──────────────────────────────────────────
progress.queryInstances=Querying instances of {0}...
progress.title=Running {0}()
progress.attach=Connecting to the target process (attach)...
progress.execute=Executing {0}()...
progress.waitResult=Waiting for the result...
progress.done=Done

# ── Parsed result text ────────────────────────────────
parsed.noResult=(no result)
parsed.asyncSubmitted=Submitted for asynchronous execution
parsed.jobId=Job ID: {0}
parsed.jobStatus=Job status: {0}
parsed.session=Session: {0}
parsed.command=Command: {0}
parsed.note=Notes:
parsed.asyncSubmitted.note1=The command has been scheduled in the target JVM.
parsed.asyncSubmitted.note2=If no result arrived within the wait limit, the target thread is most likely suspended at a breakpoint. Continue execution and invoke the method again.
parsed.failed=Execution failed
parsed.reason=Reason: {0}
parsed.sessionExpired.note1=Note: the Arthas HTTP session has expired or was cleaned up by the server.
parsed.sessionExpired.note2=The plugin recreates the session and retries. If that still fails, restart the target application and try again.
parsed.timeout=Execution timed out
parsed.timeout.limit=Timeout limit: {0} ms ({1} s)
parsed.timeout.defaultReason=Execution timed out and was forcibly interrupted by Arthas
parsed.suggestion=Suggestions:
parsed.timeout.suggestion1=1. Enable "Asynchronous execution": the command runs in the background of the target JVM, so breakpoints do not trigger the plugin HTTP timeout
parsed.timeout.suggestion2=2. Increase "Execution timeout" in Settings | Other Settings | Run Anywhere
parsed.timeout.suggestion3=3. Make sure the target method does not deadlock or block indefinitely in the target JVM

# ── JSON validation ───────────────────────────────────
json.hint.object=JSON object, e.g. {"id":1,"name":"test"}
json.hint.array=JSON array, e.g. [{"id":1}] or [1,2,3]
json.hint.map=JSON object, e.g. {"key1":{"id":1}}
json.error.object=Argument {0} must be a valid JSON object (starting with {).
json.error.array=Argument {0} must be a valid JSON array (starting with [).
json.error.map=Argument {0} must be a valid JSON object (starting with {).
json.error.generic=Argument {0} is not valid JSON.

# ── Argument value validation ─────────────────────────
validate.enum=Argument {0} must be an enum constant name, e.g. ACTIVE.
validate.boolean=Argument {0} must be true or false.
validate.char=Argument {0} must be a single character.
validate.long=Argument {0} must be an integer, e.g. 123 or 123L.
validate.decimal=Argument {0} must be a number, e.g. 1.5.
validate.bigDecimal=Argument {0} must be a number, e.g. 99.99.
validate.bigInteger=Argument {0} must be an integer, e.g. 99.
validate.integer=Argument {0} must be an integer, e.g. 123.

# ── Input placeholders ────────────────────────────────
param.placeholder.enum=Enum constant, e.g. ACTIVE
param.placeholder.long=Integer, e.g. 123 or 123L
param.placeholder.time=ISO-8601, e.g. 2026-10-08T15:04:05
param.placeholder.default=Value; leave empty to pass null

# ── Security confirmation body ────────────────────────
security.body=<html><p>This operation executes arbitrary Java methods in the <strong>running JVM</strong> through Arthas.</p><p>Before you continue:</p><ul><li>Use it only in <strong>development or debug environments</strong></li><li>Do not use it in production</li><li>Invocations may have side effects (writing to databases, sending messages, and so on)</li></ul></html>

