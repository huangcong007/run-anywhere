# Run Anywhere message bundle (English)
# The base bundle (messages.RunAnywhereBundle.properties) is Chinese; this file is
# picked up when the IDE runs with an English locale.
# Conventions: dialog and notification titles in Title Case, labels and buttons in
# sentence case, tooltips end with a period only when they are full sentences.

# ── Action ────────────────────────────────────────────
action.runMethod.text=Run Method (Run Anywhere)
action.runMethod.description=Invoke this method in the running JVM through the bundled Arthas

# ── Tool window ───────────────────────────────────────
toolWindow.title=Run Anywhere
toolWindow.welcomeTab=Welcome

# ── Process selection ─────────────────────────────────
process.select.title=Select Target Process
process.empty.title=No Process Available
process.empty.body=No running Java process was detected. Start your application, then invoke the method again.
process.info.title=Process Selected
process.info.body=Automatically selected PID {0} ({1}).

# ── Security confirmation ─────────────────────────────
security.dialog.title=Run Anywhere - Security Confirmation
security.ok=I Understand, Continue
security.cancel=Cancel
security.dontAsk=Don't ask again

# ── Parameter input ───────────────────────────────────
param.dialog.title=Method Arguments
param.ok=Invoke
param.cancel=Cancel
param.col.name=Name
param.col.type=Type
param.col.value=Value
param.col.null=Pass null
param.null.accessibleName=Pass argument {0} as null
param.empty=This method has no parameters.
param.unsupported.type=Unsupported type; null will be passed
param.unsupported.inline=Unsupported type; null will be passed
param.input.accessibleName=Argument {0}, type {1}
param.json.hint=Enter the value as JSON. The deserialization library can be configured in Settings | Other Settings | Run Anywhere.

# ── Instance selection ────────────────────────────────
instance.pick.title=Select Instance
instance.pick.ok=Invoke
instance.pick.cancel=Cancel
instance.pick.label=Class {0} has {1} created instances. Select the one to invoke.
instance.pick.cancelled=Instance selection cancelled.
instance.pick.none=Class {0} has no created instance in the target JVM.

# ── Settings ──────────────────────────────────────────
settings.name=Run Anywhere
settings.async=Asynchronous execution (wait in background, no timeout on breakpoints)
settings.async.tip=Submits the command with Arthas async_exec, then pulls the result.\nA thread suspended at a breakpoint will not trigger the plugin HTTP timeout. The wait limit equals the execution timeout.
settings.warmup=Pre-attach when the app starts
settings.warmup.tip=Attaches automatically about 2 seconds after the app starts. When off, Arthas is injected only after you click "Run Method".\nHTTP listens on 127.0.0.1 only; sessions expire after 30 minutes.
settings.timeout.label=Execution timeout (seconds)
settings.timeout.hint=Arthas timeout for synchronous execution, also the wait limit for asynchronous results ({0}-{1} seconds).
settings.jsonLib.label=JSON library for object arguments
settings.jsonLib.hint=Choose Gson or Fastjson manually if Jackson is not on the classpath. Auto mode tries each library in classpath order.
settings.restoreSecurity=Restore first-run warning
settings.restoreSecurity.tip=Show the risk confirmation dialog before the next invocation
settings.restoreSecurity.pending=Takes effect after you click Apply.
settings.docs=View documentation
settings.error.number={0} must be an integer.
settings.error.timeout=Execution timeout must be between {0} and {1} seconds (currently {2}).
settings.jsonLib.auto=Auto-detect (Jackson → Gson → Fastjson2 → Fastjson)

# ── Execution feedback ────────────────────────────────
exec.attachFail.title=Attach Failed
exec.attachFail.reasons=1. The target JVM does not allow attach\n2. Arthas failed to start in time\n3. The HTTP port is already in use
exec.attachFail.body=Failed to attach Arthas to PID {0} ({1}).\nPossible causes:\n{2}\n\nSee idea.log for details (search for [Arthas]).
exec.attachFail.notify=Could not connect to PID {0} ({1}). See the Run Anywhere tool window for details.
exec.fail.title=Invocation Failed
exec.fail.body=The invocation of {1}() on PID {0} failed.\nSee the tool window for details.
exec.cancelled=Cancelled.
exec.toolWindowUnavailable=Unable to show the result tool window. See idea.log (search [Run Anywhere]).
exec.asyncNoResult=Submitted, but no result arrived within {0} s. If the target thread is suspended at a breakpoint, continue execution and invoke the method again.

